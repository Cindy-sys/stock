name: Run R Scraper Live

on:
  schedule:
    # Chạy mỗi 5 phút, từ 0h-10h UTC (7h-17h VN), TẤT CẢ các ngày (0-6)
    - cron: '*/5 0-10 * * 0-6' 
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Cache R packages
        uses: actions/cache@v3
        with:
          path: ${{ env.R_LIBS_USER }}
          key: ${{ runner.os }}-r-${{ hashFiles('scraper.R') }}
          restore-keys: ${{ runner.os }}-r-

      - name: Install dependencies
        run: |
          Rscript -e 'if (!require("chromote")) install.packages("chromote")'
          Rscript -e 'if (!require("rvest")) install.packages("rvest")'
          Rscript -e 'if (!require("dplyr")) install.packages("dplyr")'
          Rscript -e 'if (!require("jsonlite")) install.packages("jsonlite")'
          Rscript -e 'if (!require("lubridate")) install.packages("lubridate")'
          Rscript -e 'if (!require("stringr")) install.packages("stringr")'

      - name: Run script
        run: Rscript scraper.R

      - name: Commit and Push results
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add .
          # Ghi log kèm thời gian để dễ theo dõi trong tab Code
          git commit -m "Auto-update VN30: $(date)" || echo "No changes"
          # Pull rebase để triệt để xóa lỗi 'rejected'
          git pull --rebase origin main
          git push origin main
